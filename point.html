    <style>
        #photoReaderModal {
            color: #21352c;
        }

        #photoReaderModal .photo-reader-dialog {
            width: calc(100% - 20px);
            max-width: 720px;
            margin: 10px auto;
        }

        #photoReaderModal .photo-reader-content {
            position: relative;
            max-height: calc(100vh - 20px);
            max-height: calc(100dvh - 20px);
            overflow-x: hidden;
            overflow-y: auto;
            border: 0;
            border-radius: 20px;
            background: #fffdf8;
            box-shadow: 0 18px 55px rgba(0, 0, 0, 0.35);
        }

        #photoReaderModal .photo-reader-close {
            position: absolute;
            z-index: 8;
            top: 8px;
            right: 10px;
            width: 40px;
            min-height: 40px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            color: #173c2e;
            background: rgba(255, 253, 248, 0.92);
            font-size: 29px;
            font-weight: 600;
            line-height: 38px;
            cursor: pointer;
        }

        #photoReaderModal .photo-reader-instruction {
            margin: 0;
            padding: 10px 52px 8px 16px;
            color: #617068;
            background: #fffdf8;
            font-size: 15px;
            line-height: 1.3;
        }

        #photoReaderModal .photo-reader-service-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 16px 8px;
            border-bottom: 1px solid #d7ded9;
            background: #fffdf8;
        }

        #photoReaderModal .photo-reader-stage-stack {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 3px;
            width: 100%;
            background: #fffdf8;
        }

        #photoReaderModal .photo-reader-stage {
            position: relative;
            width: 100%;
            overflow: hidden;
            cursor: pointer;
            background:
                linear-gradient(45deg, rgba(255, 255, 255, 0.04) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.04) 75%),
                #14251e;
            background-size: 52px 52px;
            box-shadow: inset 0 0 0 0 rgba(114, 223, 168, 0);
            transition: box-shadow 0.16s ease;
        }

        #photoReaderModal .photo-reader-stage.upper-frame {
            aspect-ratio: 1536 / 779;
        }

        #photoReaderModal .photo-reader-stage.lower-frame {
            aspect-ratio: 1536 / 749;
        }

        #photoReaderModal .photo-reader-stage.active-target {
            box-shadow: inset 0 0 0 4px rgba(114, 223, 168, 0.96);
        }

        #photoReaderModal .photo-reader-stage[aria-disabled="true"] {
            cursor: wait;
        }

        #photoReaderModal .photo-reader-media {
            position: absolute;
            inset: 0;
            display: none;
            width: 100%;
            height: 100%;
            margin: 0;
            object-fit: cover;
            background: #111a16;
        }

        #photoReaderModal video.photo-reader-media.active {
            display: block;
            object-fit: cover;
        }

        #photoReaderModal img.photo-reader-media.active {
            display: block;
        }

        #photoReaderModal .photo-reader-label {
            position: absolute;
            z-index: 4;
            top: 12px;
            left: 14px;
            padding: 7px 13px;
            border-radius: 999px;
            color: #fff;
            background: rgba(0, 54, 39, 0.86);
            font-size: 13px;
            font-weight: 800;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
            pointer-events: none;
        }

        #photoReaderModal .photo-reader-panel-state {
            position: absolute;
            z-index: 4;
            right: 14px;
            bottom: 12px;
            padding: 6px 11px;
            border-radius: 999px;
            color: #fff;
            background: rgba(58, 67, 62, 0.88);
            font-size: 12px;
            font-weight: 750;
            line-height: 1.2;
            pointer-events: none;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.22);
        }

        #photoReaderModal .photo-reader-stage.ready .photo-reader-panel-state {
            background: rgba(0, 74, 52, 0.92);
        }

        #photoReaderModal .photo-reader-connection {
            display: inline-flex;
            flex: 1 1 auto;
            align-items: center;
            gap: 8px;
            min-width: 0;
            padding: 7px 12px;
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 999px;
            box-sizing: border-box;
            color: #fff;
            background: rgba(58, 67, 62, 0.9);
            font-size: 13px;
            font-weight: 750;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
        }

        #photoReaderModal .photo-reader-lite-option {
            display: inline-flex;
            flex: 0 1 auto;
            align-items: center;
            gap: 7px;
            min-width: 0;
            padding: 7px 10px;
            border-radius: 999px;
            color: #174b39;
            background: #e4f1e9;
            font-size: 13px;
            font-weight: 750;
            line-height: 1.2;
            cursor: pointer;
        }

        #photoReaderModal .photo-reader-lite-option input {
            flex: 0 0 auto;
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: #196344;
        }

        #photoReaderModal .photo-reader-connection-dot {
            flex: 0 0 auto;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #c7cec9;
            box-shadow: 0 0 0 5px rgba(199, 206, 201, 0.16);
        }

        #photoReaderModal .photo-reader-connection.connecting {
            background: rgba(99, 76, 14, 0.92);
        }

        #photoReaderModal .photo-reader-connection.connecting .photo-reader-connection-dot {
            background: #ffd267;
            box-shadow: 0 0 0 5px rgba(255, 210, 103, 0.18);
        }

        #photoReaderModal .photo-reader-connection.ready {
            background: rgba(0, 74, 52, 0.92);
        }

        #photoReaderModal .photo-reader-connection.ready .photo-reader-connection-dot {
            background: #72dfa8;
            box-shadow: 0 0 0 5px rgba(114, 223, 168, 0.18);
        }

        #photoReaderModal .photo-reader-connection.error {
            background: rgba(119, 42, 34, 0.94);
        }

        #photoReaderModal .photo-reader-connection.error .photo-reader-connection-dot {
            background: #ff9d90;
            box-shadow: 0 0 0 5px rgba(255, 157, 144, 0.18);
        }

        #photoReaderModal .photo-reader-actions {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
            padding: 10px 12px;
        }

        #photoReaderModal .photo-reader-button,
        #photoReaderModal .photo-reader-file-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            align-self: stretch;
            width: 100%;
            min-width: 0;
            height: 60px;
            min-height: 60px;
            margin: 0;
            padding: 8px 10px;
            border: 0;
            border-radius: 18px;
            box-sizing: border-box;
            color: #0a4635;
            background: #e4f1e9;
            font: inherit;
            font-size: 17px;
            font-weight: 750;
            line-height: 1.2;
            text-align: center;
            white-space: normal;
            overflow-wrap: anywhere;
            cursor: pointer;
        }

        #photoReaderModal .photo-reader-button.primary {
            color: #fff;
            background: #196344;
            box-shadow: 0 9px 22px rgba(25, 99, 68, 0.2);
        }

        #photoReaderModal .photo-reader-button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }

        #photoReaderModal .photo-reader-file-button input {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            opacity: 0;
        }

        #photoReaderModal .photo-reader-status {
            margin: 0 12px 12px;
            padding: 10px 12px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.35;
        }

        #photoReaderModal .photo-reader-status.error {
            color: #7a3029;
            background: #f7e8e5;
        }

        #photoReaderModal .photo-reader-status.warning {
            color: #6f5100;
            background: #fff3cd;
        }

        @media (max-width: 575.98px) {
            #photoReaderModal .photo-reader-dialog {
                width: 100%;
                min-height: 100%;
                margin: 0;
            }

            #photoReaderModal .photo-reader-content {
                min-height: 100vh;
                min-height: 100dvh;
                max-height: 100vh;
                max-height: 100dvh;
                border-radius: 0;
            }

            #photoReaderModal .photo-reader-instruction {
                padding: 8px 48px 6px 12px;
                font-size: 14px;
            }

            #photoReaderModal .photo-reader-service-row {
                gap: 6px;
                padding: 0 10px 6px;
            }

            #photoReaderModal .photo-reader-connection,
            #photoReaderModal .photo-reader-lite-option {
                padding: 7px 9px;
                font-size: 12px;
            }

            #photoReaderModal .photo-reader-actions {
                gap: 6px;
                padding: 8px 10px 10px;
            }

            #photoReaderModal .photo-reader-button,
            #photoReaderModal .photo-reader-file-button {
                height: 56px;
                min-height: 56px;
                padding: 5px 3px;
                border-radius: 15px;
                font-size: clamp(13px, 3.8vw, 15px);
            }

            #photoReaderModal .photo-reader-status {
                margin: 0 10px 10px;
            }

        }

        @media (orientation: landscape) and (max-height: 600px) {
            #photoReaderModal .photo-reader-dialog {
                width: 100%;
                margin: 0 auto;
            }

            #photoReaderModal .photo-reader-content {
                border-radius: 0;
            }

            #photoReaderModal .photo-reader-instruction {
                padding: 6px 48px 4px 10px;
                font-size: 13px;
                line-height: 1.3;
            }

            #photoReaderModal .photo-reader-service-row {
                gap: 6px;
                padding: 0 10px 4px;
            }

            #photoReaderModal .photo-reader-connection,
            #photoReaderModal .photo-reader-lite-option {
                padding: 6px 8px;
                font-size: 11px;
            }

            #photoReaderModal .photo-reader-stage-stack {
                grid-template-rows: minmax(0, 779fr) minmax(0, 749fr);
                height: calc(100vh - 190px);
                height: calc(100dvh - 190px);
                min-height: 240px;
            }

            #photoReaderModal .photo-reader-stage.upper-frame,
            #photoReaderModal .photo-reader-stage.lower-frame {
                min-height: 0;
                aspect-ratio: auto;
            }

            #photoReaderModal .photo-reader-actions {
                gap: 6px;
                padding: 6px 10px 8px;
            }

            #photoReaderModal .photo-reader-button,
            #photoReaderModal .photo-reader-file-button {
                height: 52px;
                min-height: 52px;
                border-radius: 14px;
                font-size: 14px;
            }
        }
    </style>
</head>

		//Handle click and long press events in sets 
		var longpress = false;
		var presstimer = null;
		var longtarget = null;
		var handler = null;

		var cancel = function(e) {
			if (presstimer !== null) {
				clearTimeout(presstimer);
				presstimer = null;
				handler = null;
			}
		};

		var start = function(e) {
			if (e.type === 'click' && e.button !== 0) {
				return false;
			}

			longpress = false;
			handler = this;

			if (presstimer === null) {
				presstimer = setTimeout(function() {
					setLastTile(handler.id);
					longpress = true;
				}, 400);
			}

			return false;
		};

		$('#sets').find('img').click(function () {
			if (presstimer !== null) {
				clearTimeout(presstimer);
				presstimer = null;
				handler = null;
			}

			if (longpress) {
				return false;
			}

			setCurrentTile(this.id);
		});

		$('#sets').find('img').each(function () {
			this.addEventListener('mousedown', start);
			this.addEventListener('touchstart', start);
			this.addEventListener('mouseout', cancel);
			this.addEventListener('touchend', cancel);
			this.addEventListener('touchleave', cancel);
			this.addEventListener('touchcancel', cancel);
		});

		$('#tiles').find('img').click(function () {
			var selected = getCurrentTile();
			$('#' + selected).attr("src", this.src);
			$('#' + selected).attr("name", this.name);

			var nextTile = (parseInt(selected) == 17 ? 1 : parseInt(selected) + 1);
			setCurrentTile(nextTile);
		})

		function setCurrentTile (number) {
			$('#sets').find('img').each(function() {
				$(this).removeClass('selectedRed');
			});

			$('#' + number).addClass('selectedRed');
		}

		function getCurrentTile () {
			var number;

			$('#sets').find('img').each(function() {
				if ($(this).hasClass('selectedRed')) {
					number = this.id;
				};
			});

			return number;
		}

		function setLastTile (number) {
			$('#sets').find('img').each(function() {
				$(this).removeClass('selectedAqua');
			});

			$('#' + number).addClass('selectedAqua');
		}

		function getLastTilePosition () {
			var number;

			$('#sets').find('img').each(function() {
				if ($(this).hasClass('selectedAqua')) {
					number = this.id;
				};
			});

			return number;
		}
		//Handle click and long press events in sets

			if (valueLen !== otherLen) return false;

			// Compare two items

				// Get the object type
				var itemType = Object.prototype.toString.call(item1);

				// If an object or array, compare recursively
				if (['[object Array]', '[object Object]'].indexOf(itemType) >= 0) {

					provider: new ReCaptchaEnterpriseProvider(photoReaderAppCheckSiteKey),
					isTokenAutoRefreshEnabled: true
				});
				getToken(appCheck, false).catch(function (error) {
					console.debug("Firebase App Check token prefetch did not complete", error);
				});

				const ai = getAI(app, { backend: new GoogleAIBackend() });
				photoReaderModelCandidates = [];
				function addModelCandidates(modelName, liteFallback) {
					photoReaderModelCandidates.push({
						name: modelName,
						mode: "structured",
						liteFallback: liteFallback,
						model: getGenerativeModel(ai, {
							model: modelName,
							generationConfig: {
								responseMimeType: "application/json",
								responseSchema: photoReaderResponseSchema
							}
						})
					});
					photoReaderModelCandidates.push({
						name: modelName,
						mode: "compatibility",
						liteFallback: liteFallback,
						model: getGenerativeModel(ai, { model: modelName })
					});
				}
				photoReaderModelNames.forEach(function (modelName) {
					addModelCandidates(modelName, false);
				});
				addModelCandidates(photoReaderLiteModelName, true);
				photoReaderModel = photoReaderModelCandidates[0].model;
				setPhotoReaderConnection("Firebase 就緒", "ready");
				syncPhotoReaderButtons();
				return photoReaderModel;
			}).catch(function (error) {
				photoReaderInitialization = null;
				setPhotoReaderConnection("Firebase 錯誤", "error");
				throw error;
			});

			return photoReaderInitialization;
		}

		function stopPhotoReaderCamera() {
			if (photoReaderCameraStream) {
				photoReaderCameraStream.getTracks().forEach(function (track) {
					track.stop();
				});
				photoReaderCameraStream = null;
			}

			photoReaderCameraSection = null;
			photoReaderElements.cameras.upper.srcObject = null;
			photoReaderElements.cameras.lower.srcObject = null;
			syncPhotoReaderButtons();
		}

		async function startPhotoReaderCamera() {
			if (!window.isSecureContext) {
				setPhotoReaderStatus("相機功能需要 HTTPS。你仍可選擇已儲存的相片。", "error");
				return;
			}

			if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
				setPhotoReaderStatus("此瀏覽器不支援相機功能，請改為選擇已儲存的相片。", "error");
				return;
			}

			stopPhotoReaderCamera();
			const targetSection = photoReaderActiveSection;
			const targetSectionName = photoReaderSectionName(targetSection);
			const targetAspectRatio = targetSection === "upper"
				? photoReaderCompositeLayout.width / photoReaderCompositeLayout.upperHeight
				: photoReaderCompositeLayout.width / photoReaderCompositeLayout.lowerHeight;
			setPhotoReaderStatus("正在開啟" + targetSectionName + "相機…", "working");

			try {
				photoReaderCameraStream = await navigator.mediaDevices.getUserMedia({
					audio: false,
					video: {
						facingMode: { ideal: "environment" },
						width: { ideal: 2048 },
						height: { ideal: Math.round(2048 / targetAspectRatio) },
						aspectRatio: { ideal: targetAspectRatio }
					}
				});

				const videoTrack = photoReaderCameraStream.getVideoTracks()[0];
				if (videoTrack && typeof videoTrack.getCapabilities === "function") {
					const capabilities = videoTrack.getCapabilities();
					if (Array.isArray(capabilities.focusMode) &&
						capabilities.focusMode.includes("continuous")) {
						videoTrack.applyConstraints({
							advanced: [{ focusMode: "continuous" }]
						}).catch(function () {
							// The camera still works when manual focus constraints are unavailable.
						});
					}
				}

				photoReaderCameraSection = targetSection;
				const camera = photoReaderElements.cameras[targetSection];
				camera.srcObject = photoReaderCameraStream;
				await camera.play();
				syncPhotoReaderButtons();
				setPhotoReaderStatus("請橫向拍攝" + targetSectionName + "，並讓整排牌盡量填滿拍攝框。");
			} catch (error) {
				stopPhotoReaderCamera();
				const message = error && error.name === "NotAllowedError"
					? "相機權限被拒絕。請允許使用相機，或選擇已儲存的相片。"
					: "無法啟動相機：" + (error && error.message ? error.message : String(error));
				setPhotoReaderStatus(message, "error");
			}
		}

		function analysePhotoReaderQuality(canvas, originalCropWidth, originalCropHeight, section) {
			const sample = document.createElement("canvas");
			sample.width = 320;
			sample.height = Math.max(1, Math.round(sample.width * canvas.height / canvas.width));
			const sampleContext = sample.getContext("2d", { alpha: false, willReadFrequently: true });
			sampleContext.drawImage(canvas, 0, 0, sample.width, sample.height);
			const pixels = sampleContext.getImageData(0, 0, sample.width, sample.height).data;
			const grayscale = new Float32Array(sample.width * sample.height);
			let clippedBright = 0;
			let veryDark = 0;

			for (let pixelIndex = 0, grayIndex = 0;
				pixelIndex < pixels.length;
				pixelIndex += 4, grayIndex += 1) {
				const red = pixels[pixelIndex];
				const green = pixels[pixelIndex + 1];
				const blue = pixels[pixelIndex + 2];
				const luminance = 0.2126 * red + 0.7152 * green + 0.0722 * blue;
				grayscale[grayIndex] = luminance;
				if (red >= 253 && green >= 253 && blue >= 253) clippedBright += 1;
				if (luminance <= 30) veryDark += 1;
			}

			let laplacianSum = 0;
			let laplacianSquaredSum = 0;
			let laplacianCount = 0;
			for (let y = 1; y < sample.height - 1; y += 1) {
				for (let x = 1; x < sample.width - 1; x += 1) {
					const index = y * sample.width + x;
					const laplacian = 4 * grayscale[index] -
						grayscale[index - 1] - grayscale[index + 1] -
						grayscale[index - sample.width] - grayscale[index + sample.width];
					laplacianSum += laplacian;
					laplacianSquaredSum += laplacian * laplacian;
					laplacianCount += 1;
				}
			}

			const laplacianMean = laplacianCount ? laplacianSum / laplacianCount : 0;
			const sharpness = laplacianCount
				? laplacianSquaredSum / laplacianCount - laplacianMean * laplacianMean
				: 0;
			const pixelCount = sample.width * sample.height;
			const brightRatio = clippedBright / pixelCount;
			const darkRatio = veryDark / pixelCount;
			const warnings = [];

			const minimumCropHeight = section === "upper" ? 600 : 400;
			if (originalCropWidth < 1200 || originalCropHeight < minimumCropHeight) {
				warnings.push("相片解像度較低");
			}
			if (sharpness < 45) warnings.push("相片可能模糊");
			if (brightRatio > 0.45) warnings.push("相片可能過光");
			if (darkRatio > 0.55) warnings.push("相片可能太暗");

			return {
				sharpness: Math.round(sharpness),
				brightRatio: brightRatio,
				darkRatio: darkRatio,
				warnings: warnings
			};
		}

		function getPhotoReaderQualityWarnings() {
			const warnings = [];
			["upper", "lower"].forEach(function (section) {
				const quality = photoReaderQualities[section];
				if (!quality || quality.warnings.length === 0) return;
				warnings.push(photoReaderSectionName(section) + "：" + quality.warnings.join("、"));
			});
			return warnings;
		}

		function preparePhotoReaderSource(source, sourceWidth, sourceHeight, section) {
			const targetAspectRatio = section === "upper"
				? photoReaderCompositeLayout.width / photoReaderCompositeLayout.upperHeight
				: photoReaderCompositeLayout.width / photoReaderCompositeLayout.lowerHeight;
			const maximumWidth = 2048;
			let sourceX = 0;
			let sourceY = 0;
			let cropWidth = sourceWidth;
			let cropHeight = sourceHeight;

			if (sourceWidth / sourceHeight > targetAspectRatio) {
				cropWidth = sourceHeight * targetAspectRatio;
				sourceX = (sourceWidth - cropWidth) / 2;
			} else {
				cropHeight = sourceWidth / targetAspectRatio;
				sourceY = (sourceHeight - cropHeight) / 2;
			}

			const width = Math.max(2, Math.min(maximumWidth, Math.round(cropWidth)));
			const height = Math.max(1, Math.round(width / targetAspectRatio));
			const sourceInsetX = cropWidth * 0.015;
			const sourceInsetY = cropHeight * 0.025;

			photoReaderElements.canvas.width = width;
			photoReaderElements.canvas.height = height;
			const context = photoReaderElements.canvas.getContext("2d", { alpha: false });
			context.fillStyle = "#ffffff";
			context.fillRect(0, 0, width, height);
			context.filter = "brightness(1.02) contrast(1.08) saturate(1.02)";
			context.drawImage(
				source,
				sourceX + sourceInsetX,
				sourceY + sourceInsetY,
				cropWidth - 2 * sourceInsetX,
				cropHeight - 2 * sourceInsetY,
				0,
				0,
				width,
				height
			);
			context.filter = "none";

			photoReaderQualities[section] = analysePhotoReaderQuality(
				photoReaderElements.canvas,
				cropWidth,
				cropHeight,
				section
			);
			photoReaderImages[section] = photoReaderElements.canvas.toDataURL("image/jpeg", 0.9);
			stopPhotoReaderCamera();

			if (section === "upper") photoReaderActiveSection = "lower";
			const quality = photoReaderQualities[section];
			const sectionName = photoReaderSectionName(section);
			const nextInstruction = section === "upper"
				? (photoReaderImages.lower
					? "兩張相片均已準備，請按「辯識」。"
					: "請繼續拍攝落地；沒有落地牌可直接按「辯識」。")
				: (photoReaderImages.upper
					? "兩張相片均已準備，請按「辯識」。"
					: "落地已準備，仍需拍攝暗間。");

			if (quality.warnings.length > 0) {
				setPhotoReaderStatus(
					sectionName + "：" + quality.warnings.join("；") + "。" + nextInstruction,
					"warning"
				);
			} else {
				setPhotoReaderStatus(sectionName + "相片已準備。" + nextInstruction);
			}
			syncPhotoReaderButtons();
		}

		function takePhotoReaderPhoto() {
			const section = photoReaderCameraSection || photoReaderActiveSection;
			const camera = photoReaderElements.cameras[section];
			if (!photoReaderCameraStream ||
				!camera.videoWidth ||
				!camera.videoHeight) {
				setPhotoReaderStatus("相機尚未準備好。", "error");
				return;
			}

			preparePhotoReaderSource(
				camera,
				camera.videoWidth,
				camera.videoHeight,
				section
			);
		}

		async function loadPhotoReaderFile(file) {
			if (!file || !String(file.type || "").startsWith("image/")) {
				setPhotoReaderStatus("請選擇 JPEG、PNG 或 WebP 相片。", "error");
				return;
			}

			const targetSection = photoReaderActiveSection;
			stopPhotoReaderCamera();
			setPhotoReaderStatus("正在裁剪、校正及檢查" + photoReaderSectionName(targetSection) + "相片…", "working");
			const objectUrl = URL.createObjectURL(file);

			try {
				const image = new Image();
				await new Promise(function (resolve, reject) {
					image.onload = resolve;
					image.onerror = function () {
						reject(new Error("無法解碼所選相片。"));
					};
					image.src = objectUrl;
				});
				preparePhotoReaderSource(
					image,
					image.naturalWidth,
					image.naturalHeight,
					targetSection
				);
			} catch (error) {
				setPhotoReaderStatus("無法讀取相片：" + error.message, "error");
			} finally {
				URL.revokeObjectURL(objectUrl);
				photoReaderElements.fileInput.value = "";
			}
		}

		function inlinePhotoReaderImage(dataUrl) {
			const match = /^data:(image\/(?:jpeg|png|webp));base64,(.+)$/s.exec(dataUrl);
			if (!match) throw new Error("處理後的相片格式不受支援。");
			return { inlineData: { mimeType: match[1], data: match[2] } };
		}

		function loadPhotoReaderDataImage(dataUrl) {
			return new Promise(function (resolve, reject) {
				const image = new Image();
				image.onload = function () { resolve(image); };
				image.onerror = function () { reject(new Error("無法建立合併辨識相片。")); };
				image.src = dataUrl;
			});
		}

		function drawPhotoReaderCompositeRegion(context, image, destinationY, destinationHeight) {
			const destinationWidth = photoReaderCompositeLayout.width;
			const destinationAspectRatio = destinationWidth / destinationHeight;
			const sourceAspectRatio = image.naturalWidth / image.naturalHeight;
			let sourceX = 0;
			let sourceY = 0;
			let sourceWidth = image.naturalWidth;
			let sourceHeight = image.naturalHeight;

			if (sourceAspectRatio > destinationAspectRatio) {
				sourceWidth = sourceHeight * destinationAspectRatio;
				sourceX = (image.naturalWidth - sourceWidth) / 2;
			} else if (sourceAspectRatio < destinationAspectRatio) {
				sourceHeight = sourceWidth / destinationAspectRatio;
				sourceY = (image.naturalHeight - sourceHeight) / 2;
			}

			context.drawImage(
				image,
				sourceX,
				sourceY,
				sourceWidth,
				sourceHeight,
				0,
				destinationY,
				destinationWidth,
				destinationHeight
			);
		}

		async function buildPhotoReaderCompositeImage() {
			if (!photoReaderImages.upper) {
				throw new Error("請先拍攝暗間相片。");
			}

			const images = await Promise.all([
				loadPhotoReaderDataImage(photoReaderImages.upper),
				photoReaderImages.lower
					? loadPhotoReaderDataImage(photoReaderImages.lower)
					: Promise.resolve(null)
			]);
			const compositeCanvas = document.createElement("canvas");
			compositeCanvas.width = photoReaderCompositeLayout.width;
			compositeCanvas.height = photoReaderCompositeLayout.height;
			const context = compositeCanvas.getContext("2d", { alpha: false });
			const lowerY = photoReaderCompositeLayout.upperHeight +
				photoReaderCompositeLayout.dividerHeight;

			context.fillStyle = "#14251e";
			context.fillRect(0, 0, compositeCanvas.width, compositeCanvas.height);
			drawPhotoReaderCompositeRegion(
				context,
				images[0],
				0,
				photoReaderCompositeLayout.upperHeight
			);
			context.fillStyle = "#ffffff";
			context.fillRect(
				0,
				photoReaderCompositeLayout.upperHeight,
				photoReaderCompositeLayout.width,
				photoReaderCompositeLayout.dividerHeight
			);
			if (images[1]) {
				drawPhotoReaderCompositeRegion(
					context,
					images[1],
					lowerY,
					photoReaderCompositeLayout.lowerHeight
				);
			}

			return compositeCanvas.toDataURL("image/jpeg", 0.88);
		}

		function parsePhotoReaderJson(text) {
			const raw = typeof text === "string" ? text.trim() : "";
			if (!raw) throw new Error("Firebase AI 沒有傳回內容。");

			try {
				return JSON.parse(raw);
			} catch (_) {
				const withoutFence = raw
					.replace(/^(?:```|~~~)(?:json)?\s*/i, "")
					.replace(/\s*(?:```|~~~)$/i, "")
					.trim();

				try {
					return JSON.parse(withoutFence);
				} catch (_) {
					const firstBrace = withoutFence.indexOf("{");
					const lastBrace = withoutFence.lastIndexOf("}");
					if (firstBrace >= 0 && lastBrace > firstBrace) {
						return JSON.parse(withoutFence.slice(firstBrace, lastBrace + 1));
					}
					throw new Error("Firebase AI 沒有傳回有效的 JSON。");
				}
			}
		}

		function normalizeRecognitionPointCode(rawCode) {
			const code = String(rawCode || "").trim().toUpperCase();
			if (validPointCodes.has(code)) return code;
			return pointCodeByRecognitionCode.get(code) || null;
		}

		function pointCodesFromRecognitionSection(section, winningTileIndex) {
			const rawTiles = Array.isArray(section)
				? section
				: (Array.isArray(section && section.tiles) ? section.tiles : []);
			const numericWinningTileIndex = Number(winningTileIndex);
			const validWinningTileIndex = Number.isInteger(numericWinningTileIndex) &&
				numericWinningTileIndex >= 0 && numericWinningTileIndex < rawTiles.length
				? numericWinningTileIndex
				: -1;
			const pointCodes = [];
			let unknownCount = 0;
			let winningTileCode = null;
			let winningTileRegularIndex = null;
			let winningTileFlagCount = 0;
			let regularTileCount = 0;

			rawTiles.slice(0, 40).forEach(function (tile, tileIndex) {
				const rawCode = typeof tile === "string" ? tile : tile && tile.code;
				const pointCode = normalizeRecognitionPointCode(rawCode);
				const isWinningTile = Boolean(
					(tile && typeof tile === "object" && tile.isWinningTile === true) ||
					tileIndex === validWinningTileIndex
				);

				if (!pointCode) {
					unknownCount += 1;
					return;
				}

				if (isWinningTile) {
					winningTileFlagCount += 1;
					if (!winningTileCode) {
						winningTileCode = pointCode;
						if (regularPointCodes.has(pointCode)) {
							winningTileRegularIndex = regularTileCount;
						}
					}
				}

				pointCodes.push(pointCode);
				if (regularPointCodes.has(pointCode)) regularTileCount += 1;
			});

			return {
				pointCodes: pointCodes,
				unknownCount: unknownCount,
				winningTileCode: winningTileCode,
				winningTileRegularIndex: winningTileRegularIndex,
				winningTileFlagCount: winningTileFlagCount
			};
		}

		function comparePointCodes(left, right) {
			return Number(left) - Number(right);
		}

		function comparePointCodeGroups(left, right) {
			for (let index = 0; index < Math.min(left.length, right.length); index += 1) {
				const comparison = comparePointCodes(left[index], right[index]);
				if (comparison !== 0) return comparison;
			}
			return left.length - right.length;
		}

		function isSuitedPointCode(code) {
			const suit = Math.floor(Number(code) / 10);
			return suit >= 2 && suit <= 4;
		}

		function findConcealedHandSolutions(codes, maximumSolutions) {
			if (codes.length < 2 || codes.length % 3 !== 2) return [];

			const counts = new Map();
			codes.forEach(function (code) {
				counts.set(code, (counts.get(code) || 0) + 1);
			});
			if (Array.from(counts.values()).some(function (count) { return count > 4; })) {
				return [];
			}

			const sortedCodes = Array.from(counts.keys()).sort(comparePointCodes);
			const pairCandidates = sortedCodes.filter(function (code) {
				return (counts.get(code) || 0) >= 2;
			});
			const solutionsByKey = new Map();
			const solutionLimit = maximumSolutions || 64;

			function changeCount(code, amount) {
				counts.set(code, (counts.get(code) || 0) + amount);
			}

			function firstRemainingCode() {
				for (let index = 0; index < sortedCodes.length; index += 1) {
					if ((counts.get(sortedCodes[index]) || 0) > 0) return sortedCodes[index];
				}
				return null;
			}

			function saveSolution(pairCode, melds) {
				const normalizedMelds = melds.map(function (meld) {
					return meld.slice().sort(comparePointCodes);
				}).sort(comparePointCodeGroups);
				const key = normalizedMelds.map(function (meld) {
					return meld.join("-");
				}).join("|") + "||" + pairCode;
				if (!solutionsByKey.has(key)) {
					solutionsByKey.set(key, {
						melds: normalizedMelds,
						pair: [pairCode, pairCode],
						key: key
					});
				}
			}

			function findMelds(pairCode, remainingCount, melds) {
				if (solutionsByKey.size >= solutionLimit) return;
				if (remainingCount === 0) {
					saveSolution(pairCode, melds);
					return;
				}

				const first = firstRemainingCode();
				if (!first) return;

				if ((counts.get(first) || 0) >= 3) {
					changeCount(first, -3);
					melds.push([first, first, first]);
					findMelds(pairCode, remainingCount - 3, melds);
					melds.pop();
					changeCount(first, 3);
				}

				const rank = Number(first) % 10;
				const second = String(Number(first) + 1);
				const third = String(Number(first) + 2);
				if (isSuitedPointCode(first) && rank <= 7 &&
					(counts.get(second) || 0) > 0 &&
					(counts.get(third) || 0) > 0) {
					changeCount(first, -1);
					changeCount(second, -1);
					changeCount(third, -1);
					melds.push([first, second, third]);
					findMelds(pairCode, remainingCount - 3, melds);
					melds.pop();
					changeCount(first, 1);
					changeCount(second, 1);
					changeCount(third, 1);
				}
			}

			pairCandidates.forEach(function (pairCode) {
				if (solutionsByKey.size >= solutionLimit) return;
				changeCount(pairCode, -2);
				findMelds(pairCode, codes.length - 2, []);
				changeCount(pairCode, 2);
			});

			return Array.from(solutionsByKey.values());
		}

		function arrangeConcealedRegularCodes(codes, winningTileCode, allowGrouping) {
			const originalCounts = new Map();
			codes.forEach(function (code) {
				originalCounts.set(code, (originalCounts.get(code) || 0) + 1);
			});

			const fallbackCodes = codes.slice().sort(comparePointCodes);
			const fallbackWinningIndex = winningTileCode
				? fallbackCodes.indexOf(winningTileCode)
				: -1;
			if (!allowGrouping) {
				return {
					orderedCodes: fallbackCodes,
					pairCodes: [],
					winningIndex: fallbackWinningIndex,
					applied: false,
					ambiguous: false,
					solutionCount: 0,
					reason: "tile-count"
				};
			}

			const solutions = findConcealedHandSolutions(codes, 64);
			if (solutions.length === 0) {
				return {
					orderedCodes: fallbackCodes,
					pairCodes: [],
					winningIndex: fallbackWinningIndex,
					applied: false,
					ambiguous: false,
					solutionCount: 0,
					reason: "special-or-invalid"
				};
			}

			solutions.sort(function (left, right) {
				const leftExactPair = originalCounts.get(left.pair[0]) === 2 ? 0 : 1;
				const rightExactPair = originalCounts.get(right.pair[0]) === 2 ? 0 : 1;
				if (leftExactPair !== rightExactPair) return leftExactPair - rightExactPair;

				const leftWinningGroups = winningTileCode
					? left.melds.concat([left.pair]).filter(function (group) {
						return group.includes(winningTileCode);
					}).length
					: 0;
				const rightWinningGroups = winningTileCode
					? right.melds.concat([right.pair]).filter(function (group) {
						return group.includes(winningTileCode);
					}).length
					: 0;
				const leftUniqueWinningGroup = leftWinningGroups === 1 ? 0 : 1;
				const rightUniqueWinningGroup = rightWinningGroups === 1 ? 0 : 1;
				if (leftUniqueWinningGroup !== rightUniqueWinningGroup) {
					return leftUniqueWinningGroup - rightUniqueWinningGroup;
				}

				return left.key.localeCompare(right.key, "en");
			});

			const selected = solutions[0];
			const groups = selected.melds.concat([selected.pair]);
			const winningGroups = [];
			groups.forEach(function (group, groupIndex) {
				if (winningTileCode && group.includes(winningTileCode)) {
					winningGroups.push(groupIndex);
				}
			});

			let winningIndex = -1;
			if (winningGroups.length > 0) {
				const winningGroupIndex = winningGroups[0];
				winningIndex = groups
					.slice(0, winningGroupIndex)
					.reduce(function (total, group) { return total + group.length; }, 0) +
					groups[winningGroupIndex].indexOf(winningTileCode);
			}

			return {
				orderedCodes: groups.flat(),
				pairCodes: selected.pair.slice(),
				winningIndex: winningIndex,
				applied: true,
				ambiguous: solutions.length > 1 || winningGroups.length > 1,
				solutionCount: solutions.length,
				reason: ""
			};
		}

		function setPhotoReaderOpenCheckbox(setNumber, checked) {
			const openCheckbox = document.getElementById("set-" + setNumber + "-open");
			if (!openCheckbox) return;

			if (window.jQuery) {
				window.jQuery(openCheckbox).prop("checked", checked);
			} else {
				openCheckbox.checked = checked;
			}

			if (checked) {
				openCheckbox.setAttribute("checked", "checked");
			} else {
				openCheckbox.removeAttribute("checked");
			}
			openCheckbox.dispatchEvent(new Event("change", { bubbles: true }));
		}

		function clearPointTilesForPhotoImport() {
			if (typeof window.clearSets === "function") {
				window.clearSets();
			} else {
				for (let position = 1; position <= 17; position += 1) {
					const tile = document.getElementById(String(position));
					if (tile) {
						tile.src = "image/face-down.png";
						tile.setAttribute("name", "");
						tile.classList.remove("selectedAqua");
					}
				}
			}

			for (let setNumber = 1; setNumber <= 5; setNumber += 1) {
				setPhotoReaderOpenCheckbox(setNumber, false);
			}

			if (typeof window.clearFlowers === "function") {
				window.clearFlowers();
			} else {
				document.querySelectorAll("#flowers img").forEach(function (tile) {
					tile.classList.remove("selectedBlue");
				});
			}
		}

		function applyPhotoReaderCodes(
			upperCodes,
			lowerCodes,
			unknownCount,
			winningTileCode,
			winningTileFlagCount
		) {
			const lowerRegularEntries = lowerCodes
				.filter(function (code) { return regularPointCodes.has(code); })
				.map(function (code) { return { code: code, fromLowerSet: true }; });
			const recognizedUpperRegularCodes = upperCodes.filter(function (code) {
				return regularPointCodes.has(code);
			});
			const canGroupConcealedTiles =
				lowerRegularEntries.length % 3 === 0 &&
				recognizedUpperRegularCodes.length % 3 === 2 &&
				lowerRegularEntries.length + recognizedUpperRegularCodes.length === 17;
			const concealedArrangement = arrangeConcealedRegularCodes(
				recognizedUpperRegularCodes,
				winningTileCode,
				canGroupConcealedTiles
			);
			const upperRegularEntries = concealedArrangement.orderedCodes
				.map(function (code) { return { code: code, fromLowerSet: false }; });
			const regularEntries = lowerRegularEntries.concat(upperRegularEntries);
			const combinedCodes = upperCodes.concat(lowerCodes);
			const upperBonusCodes = upperCodes.filter(function (code) {
				return bonusPointCodes.has(code);
			});
			const bonusCodes = combinedCodes.filter(function (code) {
				return bonusPointCodes.has(code);
			});
			const importedRegularEntries = regularEntries.slice(0, 17);
			const importedRegularCodes = importedRegularEntries.map(function (entry) {
				return entry.code;
			});
			const omittedCount = Math.max(0, regularEntries.length - importedRegularEntries.length);

			clearPointTilesForPhotoImport();

			importedRegularEntries.forEach(function (entry, index) {
				const target = document.getElementById(String(index + 1));
				if (!target) return;
				target.src = "image/" + entry.code + ".png";
				target.setAttribute("name", entry.code);
			});

			let winningTilePosition = null;
			if (winningTileCode && concealedArrangement.winningIndex >= 0) {
				const calculatedPosition =
					lowerRegularEntries.length + concealedArrangement.winningIndex + 1;
				if (calculatedPosition <= importedRegularEntries.length && calculatedPosition <= 17) {
					winningTilePosition = calculatedPosition;
					if (typeof window.setLastTile === "function") {
						window.setLastTile(winningTilePosition);
					} else {
						document.querySelectorAll("#sets img").forEach(function (tile) {
							tile.classList.remove("selectedAqua");
						});
						const winningTile = document.getElementById(String(winningTilePosition));
						if (winningTile) winningTile.classList.add("selectedAqua");
					}
				}
			}

			const openSetNumbers = [];
			for (let setIndex = 0; setIndex < 5; setIndex += 1) {
				const groupEntries = importedRegularEntries.slice(setIndex * 3, setIndex * 3 + 3);
				const isOpenSet = groupEntries.some(function (entry) {
					return entry.fromLowerSet;
				});
				const setNumber = setIndex + 1;
				setPhotoReaderOpenCheckbox(setNumber, isOpenSet);
				if (isOpenSet) openSetNumbers.push(setNumber);
			}

			Array.from(new Set(bonusCodes)).forEach(function (code) {
				const bonusTile = document.querySelector("#flowers img[name=\"" + code + "\"]");
				if (bonusTile) bonusTile.classList.add("selectedBlue");
			});

			const nextPosition = Math.min(importedRegularCodes.length + 1, 17);
			if (typeof window.setCurrentTile === "function") {
				window.setCurrentTile(nextPosition || 1);
			}

			if (window.jQuery) {
				window.jQuery("#tiles").toggle(true);
				window.jQuery("#results").toggle(false);
				window.jQuery("#message").text(
					"相片已輸入：" + importedRegularCodes.length + " 只牌、" +
					Array.from(new Set(bonusCodes)).length + " 只花牌"
				);
			}

			const detail = {
				upperTileCodes: upperBonusCodes.concat(concealedArrangement.orderedCodes),
				recognizedUpperTileCodes: upperCodes.slice(),
				lowerTileCodes: lowerCodes.slice(),
				importedTileCodes: importedRegularCodes.slice(),
				bonusTileCodes: Array.from(new Set(bonusCodes)),
				openSetNumbers: openSetNumbers.slice(),
				pairTileCodes: concealedArrangement.pairCodes.slice(),
				winningTileCode: winningTileCode,
				winningTilePosition: winningTilePosition,
				winningTileFlagCount: winningTileFlagCount,
				concealedSortApplied: concealedArrangement.applied,
				concealedSortAmbiguous: concealedArrangement.ambiguous,
				concealedSortSolutionCount: concealedArrangement.solutionCount,
				unknownCount: unknownCount,
				omittedCount: omittedCount
			};
			window.dispatchEvent(new CustomEvent("mahjong-photo-reader-imported", { detail: detail }));
			return detail;
		}

		function friendlyPhotoReaderError(error) {
			const message = error instanceof Error ? error.message : String(error);
			const lower = message.toLowerCase();
			const liteFallbackEnabled = photoReaderElements.liteFallback.checked;
			if (lower.includes("app check") || lower.includes("403") || lower.includes("permission")) {
				return "Firebase App Check 拒絕了要求。請確認此網站網域已登記至 reCAPTCHA Enterprise 金鑰。";
			}
			if (lower.includes("quota") || lower.includes("429") || lower.includes("resource_exhausted")) {
				return liteFallbackEnabled
					? "Firebase／Gemini 配額目前已用完，3.5 Flash Lite 亦未能完成；請待配額重設後再試。"
					: "Firebase／Gemini 配額目前已用完。可勾選「允許 3.5 Lite 備用」後再試；若專案總配額已用完，仍需等待配額重設。";
			}
			if (lower.includes("invalid argument") || /\[400\s*\]/.test(lower)) {
				return "Firebase 拒絕了相片要求（400）。標準及相容模式都未能處理此相片，請重新拍攝較清晰的相片後再試。";
			}
			if (lower.includes("high demand") || /\[(500|502|503|504)\s*\]/.test(lower)) {
				return liteFallbackEnabled
					? "Gemini 3.8、3.6 及 3.5 Flash Lite 目前都未能完成，請稍後再試。"
					: "Gemini 3.8 及 3.6 模型目前都很繁忙；可勾選「允許 3.5 Lite 備用」後再試。";
			}
			if (lower.includes("failed to fetch") || !navigator.onLine) {
				return "無法連線至辨識服務，請檢查網絡連線後再試。";
			}
			return "辨識失敗：" + message;
		}

		function isTemporaryPhotoReaderModelError(error) {
			const message = (error instanceof Error ? error.message : String(error)).toLowerCase();
			return message.includes("high demand") ||
				message.includes("temporarily unavailable") ||
				message.includes("resource_exhausted") ||
				message.includes("model is not available") ||
				message.includes("model not found") ||
				/\[(404|429|500|502|503|504)\s*\]/.test(message);
		}

		function isInvalidPhotoReaderRequest(error) {
			const message = (error instanceof Error ? error.message : String(error)).toLowerCase();
			return message.includes("invalid argument") || /\[400\s*\]/.test(message);
		}

		function recognitionSectionFromParsed(parsed, sectionKey) {
			const section = parsed && parsed[sectionKey];
			const candidates = [
				section && section.tiles,
				section && section.tileCodes,
				parsed && parsed[sectionKey + "Tiles"],
				parsed && parsed[sectionKey + "TileCodes"]
			];

			for (let index = 0; index < candidates.length; index += 1) {
				if (Array.isArray(candidates[index])) return candidates[index];
			}
			return [];
		}

		function hasRecognitionSectionArray(parsed, sectionKey) {
			const section = parsed && parsed[sectionKey];
			return Boolean(
				Array.isArray(section && section.tiles) ||
				Array.isArray(section && section.tileCodes) ||
				Array.isArray(parsed && parsed[sectionKey + "Tiles"]) ||
				Array.isArray(parsed && parsed[sectionKey + "TileCodes"])
			);
		}

		function upperWinningTileIndexFromParsed(parsed) {
			const section = parsed && parsed.upper;
			const value = parsed && parsed.upperWinningTileIndex !== undefined
				? parsed.upperWinningTileIndex
				: section && section.winningTileIndex;
			const numericValue = Number(value);
			return Number.isInteger(numericValue) ? numericValue : -1;
		}

		function waitForPhotoReader(milliseconds) {
			return new Promise(function (resolve) {
				window.setTimeout(resolve, milliseconds);
			});
		}

		async function recognizePhotoReaderPhoto() {
			let lastError = null;
			let skipCompatibilityForModel = null;
			const allowLiteFallback = photoReaderElements.liteFallback.checked;
			const hasLowerImage = Boolean(photoReaderImages.lower);
			const compositeImageData = await buildPhotoReaderCompositeImage();
			const requestParts = [
				buildPhotoReaderPrompt(hasLowerImage),
				inlinePhotoReaderImage(compositeImageData)
			];

			for (let index = 0; index < photoReaderModelCandidates.length;
				index += 1) {
				const candidate = photoReaderModelCandidates[index];
				if (candidate.liteFallback && !allowLiteFallback) {
					continue;
				}
				if (candidate.mode === "compatibility" &&
					skipCompatibilityForModel === candidate.name) {
					continue;
				}

				const displayName = candidate.name +
					(candidate.mode === "compatibility" ? "（相容模式）" : "");
				const maximumAttempts = candidate.mode === "structured" ? 2 : 1;
				let candidateError = null;

				for (let attempt = 0; attempt < maximumAttempts; attempt += 1) {
					setPhotoReaderConnection(displayName, "connecting");
					setPhotoReaderStatus(
						"Gemini 正在使用 " + displayName +
						(hasLowerImage ? " 從一張合併相片辨識暗間及落地…" : " 辨識暗間；落地留空…"),
						"working"
					);

					try {
						const response = await candidate.model.generateContent(requestParts);
						const parsed = parsePhotoReaderJson(response.response.text());
						if (!hasRecognitionSectionArray(parsed, "upper") ||
							!hasRecognitionSectionArray(parsed, "lower")) {
							throw new Error("Firebase AI JSON 缺少 upperTileCodes 或 lowerTileCodes。");
						}

						return {
							upper: pointCodesFromRecognitionSection(
								recognitionSectionFromParsed(parsed, "upper"),
								upperWinningTileIndexFromParsed(parsed)
							),
							lower: pointCodesFromRecognitionSection(
								recognitionSectionFromParsed(parsed, "lower"),
								-1
							),
							modelName: candidate.name,
							compatibilityMode: candidate.mode === "compatibility",
							fallbackUsed: candidate.name !== photoReaderModelNames[0],
							liteFallbackUsed: candidate.liteFallback
						};
					} catch (error) {
						candidateError = error;
						lastError = error;
						console.warn(
							"Photo reader model attempt failed",
							candidate.name,
							candidate.mode,
							error
						);

						if (isTemporaryPhotoReaderModelError(error) &&
							attempt < maximumAttempts - 1) {
							setPhotoReaderConnection(candidate.name + " 重試中", "connecting");
							setPhotoReaderStatus(candidate.name + " 暫時繁忙，1 秒後重試一次…", "working");
							await waitForPhotoReader(900);
							continue;
						}
						break;
					}
				}

				const invalidRequest = isInvalidPhotoReaderRequest(candidateError);
				const temporaryModelError = isTemporaryPhotoReaderModelError(candidateError);
				const responseFormatError = String(candidateError && candidateError.message || candidateError)
					.toLowerCase()
					.includes("json");

				if (temporaryModelError) {
					skipCompatibilityForModel = candidate.name;
					setPhotoReaderConnection("模型繁忙，切換中", "connecting");
					setPhotoReaderStatus(candidate.name + " 暫時繁忙，正在改用下一個可用模型…", "working");
					continue;
				}
				if ((invalidRequest || responseFormatError) &&
					candidate.mode === "structured") {
					setPhotoReaderConnection("相容模式", "connecting");
					setPhotoReaderStatus(candidate.name + " 結構化模式未能處理要求，正在用同一模型的相容模式重試…", "working");
					continue;
				}
				if ((invalidRequest || responseFormatError) &&
					index < photoReaderModelCandidates.length - 1) {
					continue;
				}
				throw candidateError;
			}

			throw lastError || new Error("沒有可用的 Gemini 辨識模型。");
		}

		function validateRecognizedPointCodes(upperCodes, lowerCodes) {
			const warnings = [];
			const counts = new Map();
			upperCodes.concat(lowerCodes).forEach(function (code) {
				counts.set(code, (counts.get(code) || 0) + 1);
			});

			counts.forEach(function (count, code) {
				const maximum = bonusPointCodes.has(code) ? 1 : 4;
				if (count > maximum) {
					warnings.push(code + " 出現 " + count + " 次");
				}
			});

			const regularCount = upperCodes.concat(lowerCodes).filter(function (code) {
				return regularPointCodes.has(code);
			}).length;
			if (regularCount > 17) warnings.push("一般牌超過 17 只");
			return warnings;
		}

		async function recognizePhotoReaderImage() {
			if (!photoReaderImages.upper || photoReaderRecognizing) {
				return;
			}

			photoReaderRecognizing = true;
			syncPhotoReaderButtons();
			photoReaderElements.recognizeButton.textContent = "辯識中…";
			setPhotoReaderConnection("準備辨識", "connecting");
			setPhotoReaderStatus(
				photoReaderImages.lower
					? "正在合併暗間及落地相片，準備辨識要求…"
					: "正在準備暗間相片的辨識要求；落地將留空…",
				"working"
			);

			try {
				await initializePhotoReader();
				const result = await recognizePhotoReaderPhoto();
				const upper = result.upper;
				const lower = result.lower;
				setPhotoReaderConnection(
					result.modelName + (result.compatibilityMode ? "（相容模式）" : ""),
					"ready"
				);
				const unknownCount = upper.unknownCount + lower.unknownCount;
				const fallbackUsed = result.fallbackUsed;
				const liteFallbackUsed = result.liteFallbackUsed;
				const recognitionWarnings = validateRecognizedPointCodes(
					upper.pointCodes,
					lower.pointCodes
				);

				if (upper.pointCodes.length + lower.pointCodes.length === 0) {
					throw new Error("未能辨識任何麻將牌，請使用較清晰的相片再試。");
				}

				const imported = applyPhotoReaderCodes(
					upper.pointCodes,
					lower.pointCodes,
					unknownCount,
					upper.winningTileCode,
					upper.winningTileFlagCount
				);
				photoReaderResetImagesOnOpen = true;
				let message = "已匯入 " + imported.importedTileCodes.length +
					" 只一般牌及 " + imported.bonusTileCodes.length + " 只花牌。";

				if (imported.unknownCount > 0) {
					message += " 已略過 " + imported.unknownCount + " 只未能辨識的牌。";
				}
				if (imported.omittedCount > 0) {
					message += " 計分頁只有 17 個位置，已略過另外 " +
						imported.omittedCount + " 只牌。";
				}
				if (imported.concealedSortApplied) {
					message += " 暗間已分組，一對牌已放在最後。";
				} else {
					message += " 暗間未能確定一般牌型，已按牌碼排列，請人手核對。";
				}
				if (imported.concealedSortAmbiguous) {
					message += " 暗間存在多種有效排法，請核對牌組及食糊牌位置。";
				}
				if (imported.winningTilePosition && imported.winningTileFlagCount === 1) {
					message += " 已自動標示食糊牌。";
				} else if (imported.winningTilePosition) {
					message += " 已暫時標示食糊牌，但辨認結果不唯一，請核對。";
				} else {
					message += " 未能唯一辨認凸起的食糊牌，請長按正確牌作標示。";
				}
				if (liteFallbackUsed) {
					message += " 3.8 及 3.6 未能完成，本次已使用 3.5 Flash Lite 備用模型；準確度可能較低，請特別核對。";
				} else if (fallbackUsed) {
					message += " 主模型繁忙，本次已自動使用完整 Flash 備用模型。";
				}
				if (result.compatibilityMode) {
					message += " 本次使用同一模型的相容模式。";
				}
				if (recognitionWarnings.length > 0) {
					const warningText = " 辨識結果可能有問題：" + recognitionWarnings.join("；") + "，請人手核對。";
					message += warningText;
				}
				const qualityWarnings = getPhotoReaderQualityWarnings();
				if (qualityWarnings.length > 0) {
					message += " 相片曾有清晰度提示（" + qualityWarnings.join("；") + "），請核對牌面。";
				}

				setPhotoReaderStatus(message, "success");
				setTimeout(function () {
					if (window.jQuery) window.jQuery(photoReaderElements.modal).modal("hide");
				}, 900);
			} catch (error) {
				console.error("Photo reader recognition failed", error);
				setPhotoReaderConnection("Firebase 錯誤", "error");
				setPhotoReaderStatus(friendlyPhotoReaderError(error), "error");
			} finally {
				photoReaderRecognizing = false;
				photoReaderElements.recognizeButton.textContent = "辯識";
				syncPhotoReaderButtons();
			}
		}

		photoReaderElements.openButton.addEventListener("click", function () {
			if (window.jQuery) window.jQuery(photoReaderElements.modal).modal("show");
			if (photoReaderResetImagesOnOpen) {
				photoReaderImages = { upper: null, lower: null };
				photoReaderQualities = { upper: null, lower: null };
				photoReaderActiveSection = "upper";
				photoReaderResetImagesOnOpen = false;
			}
			syncPhotoReaderButtons();

			function showPhotoReaderReadyStatus() {
				const qualityWarnings = getPhotoReaderQualityWarnings();
				if (!photoReaderImages.upper) {
					setPhotoReaderStatus("請先拍攝或選擇暗間相片；完成後再拍攝落地。");
				} else if (qualityWarnings.length > 0) {
					setPhotoReaderStatus(
						qualityWarnings.join("；") + "。建議重拍以提高準確度，或直接按「辯識」繼續。",
						"warning"
					);
				} else if (!photoReaderImages.lower) {
					setPhotoReaderStatus("暗間已準備；請拍攝落地，沒有落地牌則可直接按「辯識」。");
				} else {
					setPhotoReaderStatus("暗間及落地相片已準備好，請按「辯識」。");
				}
			}

			if (!photoReaderModel) {
				setPhotoReaderStatus("正在連接 Firebase AI…", "working");
				initializePhotoReader().then(function () {
					showPhotoReaderReadyStatus();
				}).catch(function (error) {
					setPhotoReaderStatus(friendlyPhotoReaderError(error), "error");
				});
			} else {
				showPhotoReaderReadyStatus();
			}
		});

		photoReaderElements.startButton.addEventListener("click", startPhotoReaderCamera);
		photoReaderElements.takeButton.addEventListener("click", takePhotoReaderPhoto);
		photoReaderElements.fileInput.addEventListener("change", function (event) {
			loadPhotoReaderFile(event.target.files && event.target.files[0]);
		});
		photoReaderElements.recognizeButton.addEventListener("click", recognizePhotoReaderImage);
		["upper", "lower"].forEach(function (section) {
			const stage = photoReaderElements.stages[section];
			stage.addEventListener("click", function () {
				selectPhotoReaderSection(section);
			});
			stage.addEventListener("keydown", function (event) {
				if (event.key === "Enter" || event.key === " ") {
					event.preventDefault();
					selectPhotoReaderSection(section);
				}
			});
		});

		if (window.jQuery) {
			window.jQuery(photoReaderElements.modal).on("hidden.bs.modal", stopPhotoReaderCamera);
		}
		window.addEventListener("pagehide", stopPhotoReaderCamera);
		renderPhotoReaderStages();
		syncPhotoReaderButtons();
	</script>
</body>
